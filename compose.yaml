# docker compose up -d   /   podman compose up -d
services:
  planifold:
    build: .
    image: ghcr.io/christag/planifold:latest
    ports:
      - "3000:3000"
    environment:
      # Generate one with:  openssl rand -base64 32
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      # First administrator, created once when the database is empty.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Optional single sign-on (see docs/deploy.md)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SAML_IDP_SSO_URL: ${SAML_IDP_SSO_URL:-}
      SAML_IDP_ISSUER: ${SAML_IDP_ISSUER:-}
      SAML_IDP_CERT: ${SAML_IDP_CERT:-}
      SAML_ADMIN_EMAILS: ${SAML_ADMIN_EMAILS:-}
      SAML_ENFORCE: ${SAML_ENFORCE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - planifold-data:/data
      # Drop extra plugin directories here; they load on start or via Admin → Integrations → Reload.
      - ./plugins-extra:/plugins:ro
    restart: unless-stopped

volumes:
  planifold-data:
